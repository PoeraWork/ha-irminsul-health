[project]
name = "irminsul-health"
version = "0.1.0"
description = "A person-centered health data hub for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{ name = "Poera" }]

[dependency-groups]
test = [
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
  "pytest-homeassistant-custom-component==0.13.357",
]
lint = ["ruff>=0.12.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "E", "F", "I", "PIE", "RUF", "SIM", "UP"]
